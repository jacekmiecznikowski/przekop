async function handleUI(action){let [a,id,path]=action.split(':');if(a==='shortcuts'){openKeyboardHelp();return}if(a==='theme'){state.dark=!state.dark;save();closePopup();chrome(route());return}if(a==='logout'){ui.guest=true;save();closePopup();go('home');render();return}if(a==='copy'){share(+id);closePopup();return}if(a==='collection'){if(!requireAccount())return;let anchor=popupAnchor;closePopup();if(anchor?.isConnected)collectionMenu(anchor,+id);return}if(a==='readall'){ui.notifications.forEach(n=>n.read=true);save();let was=popupKind==='notifications';closePopup();render();if(was)notificationPopup();return}if(a==='notice'){let n=ui.notifications.find(n=>n.id===+id);if(n){n.read=true;save();closePopup();go('post/'+n.post);render()}return}if(!requireAccount())return;closePopup();if(a==='unblock'){ui.blocked=ui.blocked.filter(u=>u!==id)}else if(a==='block'){if(!await actionDialog({title:'Zablokować użytkownika?',text:'Publikacje i komentarze użytkownika '+id+' zostaną ukryte.',confirm:'Zablokuj',danger:true}))return;if(!ui.blocked.includes(id))ui.blocked.push(id)}else if(a==='hide'){if(!ui.hiddenPosts.includes(+id))ui.hiddenPosts.push(+id);toast('Ukryto publikację')}else if(a==='report'){let why=await actionDialog({title:'Zgłoś treść',text:'Wybierz powód zgłoszenia. Zostanie zapisany lokalnie.',confirm:'Zgłoś',kind:'report'});if(!why?.trim())return;ui.reports.push({rid:'r'+Date.now(),id:+id,path:path||'',why:why.trim(),status:'pending',created:'Teraz'});toast('Zgłoszenie zapisane lokalnie')}else if(a==='edit'){let c=path?commentAt(+id,path):state.posts.find(p=>p.id===+id);if(!c||c.user!=='me')return;let text=await actionDialog({title:'Edytuj treść',confirm:'Zapisz',kind:'text',value:c.body});if(text===null||!text.trim())return;if(!path&&c.kind==='link'&&(inlineURL(text)||hashtags(text).length)){toast('Link i tagi mają osobne pola.');return}c.body=text.trim().slice(0,5000);if(!path&&c.kind==='text')c.tags=hashtags(c.body)}else if(a==='delete'){let c=path?commentAt(+id,path):state.posts.find(p=>p.id===+id);if(!c||c.user!=='me'||!await actionDialog({title:'Usunąć treść?',text:'Tej operacji nie można cofnąć.',confirm:'Usuń',danger:true}))return;if(path){let p=state.posts.find(p=>p.id===+id),parts=path.split('.').map(Number),arr=p.comments;for(let i of parts.slice(0,-1))arr=arr[i].replies;arr.splice(parts.at(-1),1);Object.keys(state.commentVotes).filter(k=>k.startsWith(id+':')).forEach(k=>delete state.commentVotes[k])}else{state.posts=state.posts.filter(p=>p.id!==+id);go('home')}}save();render()}

function placeFloating(p,a,w){let r=a.getBoundingClientRect(),width=Math.min(w,window.innerWidth-24);p.style.width=width+'px';p.style.left=Math.max(12,Math.min(r.left,window.innerWidth-width-12))+'px';let down=window.innerHeight-r.bottom-12,up=r.top-12,above=down<180&&up>down;p.style.maxHeight=Math.max(100,above?up:down)+'px';p.style.top=above?'auto':r.bottom+6+'px';p.style.bottom=above?window.innerHeight-r.top+6+'px':'auto'}
function suggestionsFor(e){if(!e.matches('textarea[name=body],input#tags')||!e.form)return closeSuggestions();if(e.id==='body'&&route()==='compose'&&mode==='link'&&e.value.slice(0,e.selectionStart).match(/(?:^|\s)#[\p{L}\p{N}_]*$/u))return closeSuggestions();let left=e.value.slice(0,e.selectionStart),m=left.match(/(?:^|[\s,])([@#])([\p{L}\p{N}_]*)$/u);if(!m)return closeSuggestions();let d=searchData(m[2]),items=(m[1]==='@'?d.users:d.tags).slice(0,7);if(!items.length)return closeSuggestions();suggestionField=e;suggestionToken={start:e.selectionStart-m[2].length-1,end:e.selectionStart,prefix:m[1]};suggestionItems=items;suggestionIndex=0;renderSuggestions()}
function renderSuggestions(){let p=$('#editorSuggestions');if(!suggestionField?.isConnected)return closeSuggestions();p.innerHTML='<div class="search-section-title">'+(suggestionToken.prefix==='@'?'Wzmianka o użytkowniku':'Tag')+'</div>'+suggestionItems.map((v,i)=>'<button type="button" class="search-result suggestion-row '+(i===suggestionIndex?'active':'')+'" data-suggestion="'+i+'">'+(suggestionToken.prefix==='@'?avatar(v):I('hash'))+'<span>'+esc(suggestionToken.prefix+v)+'</span></button>').join('')+'<div class="suggestion-hint">↑ ↓ wybór · Enter wstaw · Esc zamknij</div>';p.hidden=false;placeFloating(p,suggestionField,320)}
function chooseSuggestion(i){let e=suggestionField,t=suggestionToken,v=suggestionItems[i];if(!e||!v)return;let value=t.prefix+v+' ';if(e.maxLength>=0&&e.value.length-(t.end-t.start)+value.length>e.maxLength){closeSuggestions();return}e.setRangeText(value,t.start,t.end,'end');closeSuggestions();if(e.id==='tags')changeDraft({target:e});else editorInput(e);e.focus()}
document.addEventListener('input',e=>{if(e.target.matches('textarea[name=body],input#tags'))suggestionsFor(e.target)});
document.addEventListener('keydown',e=>{if(e.target!==suggestionField||$('#editorSuggestions').hidden||e.isComposing||e.keyCode===229)return;if(e.key==='Enter'&&(e.shiftKey||e.ctrlKey||e.metaKey||e.altKey)){closeSuggestions();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestionIndex=(suggestionIndex+(e.key==='ArrowDown'?1:-1)+suggestionItems.length)%suggestionItems.length;renderSuggestions()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();chooseSuggestion(suggestionIndex)}else if(e.key==='Escape'){e.preventDefault();closeSuggestions()}});

let discussionSort='default';
function toggleThread(btn){let replies=btn.closest('.comment').querySelector(':scope > .thread-replies');if(!replies)return;replies.hidden=!replies.hidden;btn.setAttribute('aria-expanded',String(!replies.hidden));btn.querySelector('span').textContent=(replies.hidden?'Pokaż':'Zwiń')+' odpowiedzi ('+replies.dataset.countValue+')'}
function discussionList(p){let rows=p.comments.map((c,i)=>({c,path:String(i)})).filter(x=>!ui.blocked.includes(x.c.user));if(discussionSort==='best')rows.sort((a,b)=>commentScore(b.c,p.id,b.path)-commentScore(a.c,p.id,a.path));if(discussionSort==='new')rows.reverse();return rows.length?rows.map(x=>commentHTML(x.c,p.id,x.path)).join(''):'<div class="empty discussion-empty">Brak komentarzy.</div>'}
function discussionControls(n){return '<div class="row between discussion-head"><h3>Komentarze ('+n+')</h3><select class="select" aria-label="Sortowanie komentarzy" onchange="discussionSort=this.value;render()">'+[['default','Domyślnie'],['best','Najlepsze'],['new','Najnowsze']].map(([k,l])=>'<option value="'+k+'" '+(discussionSort===k?'selected':'')+'>'+l+'</option>').join('')+'</select></div>'}
function commentHTML(c,id,path,compact=false){if(ui.blocked.includes(c.user))return '';if(modHidden(id,path))return '<div class="comment moderated-placeholder">'+I('shield')+' Komentarz ukryty przez moderację (demo).</div>';return '<div class="comment">'+user(c.user)+longText(c.body,'comment:'+id+':'+path,'comment')+'<div class="comment-actions">'+commentVotes(c,id,path)+(compact?'<a href="#post/'+id+'">Odpowiedz</a>':'<button class="reply-btn" onclick="openReply('+id+',\''+path+'\')">Odpowiedz</button><button class="comment-more" aria-label="Opcje komentarza" onclick="contextMenu(this,'+id+',\''+path+'\')">'+I('dots')+'</button>')+(compact||!(c.replies||[]).length?'':'<button class="reply-btn thread-toggle" type="button" onclick="toggleThread(this)" aria-expanded="true">'+I('down')+' <span>Zwiń odpowiedzi ('+count(c.replies)+')</span></button>')+'</div>'+(compact?'':'<div id="reply-'+path.replaceAll('.','-')+'"></div><div class="thread-replies" data-count-value="'+count(c.replies)+'">'+(c.replies||[]).map((x,i)=>commentHTML(x,id,path+'.'+i)).join('')+'</div>')+'</div>'}
function topComments(p){let ranked=(p.comments||[]).map((c,i)=>({c,path:String(i),s:commentScore(c,p.id,String(i))})).filter(x=>x.s>=3&&!ui.blocked.includes(x.c.user)).sort((a,b)=>b.s-a.s);if(!ranked.length)return [];let threshold=Math.max(3,Math.ceil(ranked[0].s*.25));return ranked.filter(x=>x.s>=threshold).slice(0,3)}
function commentPreview(p){let top=topComments(p);if(!top.length)return '';return '<section class="comment-preview" aria-label="Najlepsze komentarze">'+top.map(x=>commentHTML(x.c,p.id,x.path,true)).join('')+'<a class="all-comments" href="#post/'+p.id+'">Zobacz wszystkie komentarze ('+count(p.comments)+') →</a></section>'}
function commentKeyboardHint(){return '<span class="comment-key-hint">'+(ui.prefs.commentEnterSend?'<kbd>Enter</kbd> wysyła · <kbd>Shift</kbd> + <kbd>Enter</kbd> nowa linia':'<kbd>Enter</kbd> nowa linia')+'</span>'}
function commentEnter(e){let field=e.target;if(e.key!=='Enter'||e.defaultPrevented||e.isComposing||e.keyCode===229||field?.dataset?.editor!=='comment'||!field.form)return;if(e.shiftKey||e.ctrlKey||e.metaKey){if(e.altKey)return;e.preventDefault();let a=field.selectionStart,b=field.selectionEnd;if(field.value.length-(b-a)+1<=field.maxLength){field.setRangeText('\n',a,b,'end');editorInput(field);closeSuggestions()}return}if(e.altKey||!ui.prefs.commentEnterSend)return;e.preventDefault();if(e.repeat||!field.value.trim())return;let submit=field.form.querySelector('button[type=submit]');if(submit&&!submit.disabled)field.form.requestSubmit(submit)}
function commentForm(id,path='',demo=false){let reply=path!=='';return '<form class="comment-form '+(reply?'reply-form':'')+'" onsubmit="'+(demo?'demoComment(event)':'addComment(event,'+id+(reply?',\''+path+'\'':'')+')')+'"><textarea name="body" data-editor="comment" maxlength="2000" required rows="3" aria-label="'+(reply?'Odpowiedź':'Komentarz')+'" placeholder="'+(reply?'Napisz odpowiedź…':'Dodaj komentarz…')+'" oninput="editorInput(this)"></textarea>'+editorTools({},true,'comment')+'<div class="comment-form-actions">'+(reply?'<button type="button" class="cancel-reply" onclick="'+(demo?'this.form.reset();editorInput(this.form.querySelector(\'textarea\'))':'closeReply(\''+path+'\')')+'">Anuluj</button>':'')+'<button type="submit" class="primary" disabled>'+(reply?'Odpowiedz':'Dodaj komentarz')+'</button>'+commentKeyboardHint()+'</div></form>'}
function demoComment(e){e.preventDefault();e.target.reset();editorInput(e.target.querySelector('textarea'));toast('Komentarz testowy')}
function closeReply(path){closeFaces();let el=document.getElementById('reply-'+path.replaceAll('.','-'));if(el)el.innerHTML=''}
function openReply(id,path){if(!requireAccount())return;let el=document.getElementById('reply-'+path.replaceAll('.','-'));if(!el)return;if(el.innerHTML){closeReply(path);return}el.innerHTML=commentForm(id,path);el.querySelector('textarea').focus()}
function addComment(e,id,path=''){e.preventDefault();if(!requireAccount())return;let b=e.target.body.value.trim().slice(0,2000);if(!b)return;let a=state.posts.find(p=>p.id===id).comments;if(path)for(const i of path.split('.'))a=a[+i].replies||(a[+i].replies=[]);a.push({user:'me',body:b,score:0,replies:[]});save();render()}
function persistDraft(){try{sessionStorage.setItem('przekop-draft-v1',JSON.stringify({text:{...drafts.text,image:''},link:{...drafts.link,image:''}}))}catch{}}
function switchMode(m){mode=m;renderEditor()}
function changeDraft(e){drafts[mode][e.target.name]=e.target.value;persistDraft();syncEditor()}
function syncEditor(){let d=drafts[mode],err=validate(d,false);$('#counter').textContent=d.body.length+' / 5000';$('#editorError').textContent=err;$('#publish').disabled=!!validate(d,true);let p=$('#linkPreview');if(p)p.innerHTML=linkCard({url:d.url,title:d.title});let pv=$('#preview');if(pv)pv.innerHTML=''}
function validate(d,required){if(d.poll&&required&&(!d.poll.question.trim()||d.poll.options.filter(x=>x.trim()).length<2||d.poll.options.some(x=>!x.trim())))return 'Uzupełnij pytanie i wszystkie odpowiedzi ankiety.';if(mode==='link'){if(inlineURL(d.body)||hashtags(d.body).length||inlineURL(d.title)||hashtags(d.title).length)return 'Link i tagi dodaj w przeznaczonych do tego polach.';if(d.url&&!safeurl(d.url))return 'Podaj poprawny adres URL.';if(required&&(!safeurl(d.url)||!d.title.trim()||!parseTags(d.tags).length))return 'Uzupełnij link, tytuł i przynajmniej jeden tag.'}else if(required&&!d.body.trim()&&!d.image&&!d.poll)return 'Dodaj treść lub zdjęcie.';return ''}
function editorInput(e){if(e.dataset.editor){let c=e.form?.querySelector('.editor-counter');if(c)c.textContent=e.value.length+' / '+e.maxLength;let b=e.form?.querySelector('button[type=submit]');if(b)b.disabled=!e.value.trim();return}changeDraft({target:e})}
let faceAnchor=null,faceTarget=null;
function insert(t,target){let e=target||$('#body');if(!e)return;let a=e.selectionStart,b=e.selectionEnd;if(e.value.length-(b-a)+t.length>e.maxLength)return;e.setRangeText(t,a,b,'end');editorInput(e);e.focus()}
function attach(e){let f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>1500000){toast('Wybierz JPG, PNG, GIF lub WebP do 1,5 MB.');return}let m=mode,r=new FileReader();r.onload=()=>{drafts[m].image=r.result;if(mode===m)renderEditor()};r.readAsDataURL(f)}
function removeImage(){drafts[mode].image='';renderEditor()}
function makePost(){let d=drafts[mode];return {id:Date.now(),createdAt:Date.now(),user:'me',time:'teraz',kind:mode,title:mode==='link'?d.title.trim():'',body:d.body.trim(),url:mode==='link'?safeurl(d.url):'',tags:mode==='link'?parseTags(d.tags):hashtags(d.body),image:d.image,adult:!!d.adult,poll:d.poll?{question:d.poll.question.trim(),options:d.poll.options.map(x=>x.trim()),votes:d.poll.options.map(()=>0)}:null,score:0,comments:[]}}
function preview(){let err=validate(drafts[mode],true);if(err){toast(err);return}$('#preview').innerHTML='<h3 style="margin:20px 0 12px">Podgląd</h3>'+post(makePost(),true)}
function publish(e){e.preventDefault();let err=validate(drafts[mode],true);if(err){toast(err);return}let p=makePost();if(p.tags.includes('polityka')){toast('Tag #polityka jest niedostępny.');return}state.posts.unshift(p);if(!save()){state.posts.shift();return}drafts[mode]={body:'',title:'',url:'',tags:'',image:''};persistDraft();go('post/'+p.id);toast('Wpis opublikowany')}

function formatText(mark,btn){let e=btn?.closest('form')?.querySelector('textarea[name=body]')||$('#body');if(!e)return;let a=e.selectionStart,b=e.selectionEnd,t=e.value.slice(a,b)||'tekst';let m=mark==='code'?String.fromCharCode(96):mark;let value=mark==='>'?'> '+t:m+t+m;if(e.value.length-(b-a)+value.length>e.maxLength)return;e.setRangeText(value,a,b,'end');editorInput(e);e.focus();if(a===b)e.setSelectionRange(a+(mark==='>'?2:m.length),a+(mark==='>'?2:m.length)+t.length)}
function positionFaces(){let el=$('#faces'),btn=faceAnchor;if(!el||el.hidden||!btn)return;if(!btn.isConnected){closeFaces();return}let r=btn.getBoundingClientRect(),w=Math.min(490,window.innerWidth-24);el.style.width=w+'px';el.style.left=Math.max(12,Math.min(r.left,window.innerWidth-w-12))+'px';let below=window.innerHeight-r.bottom-12,above=r.top-12,up=below<Math.min(420,above)&&above>below;el.style.maxHeight=Math.max(100,up?above-8:below-8)+'px';el.style.top=up?'auto':r.bottom+8+'px';el.style.bottom=up?window.innerHeight-r.top+8+'px':'auto'}
function closeFaces(focus=false){let el=$('#faces'),btn=faceAnchor;if(el)el.hidden=true;if(btn){btn.setAttribute('aria-expanded','false');if(focus&&btn.isConnected)btn.focus()}faceAnchor=null;faceTarget=null}
function toggleFaces(btn){closeSuggestions();hideUserCard();let el=$('#faces');if(!el.hidden&&faceAnchor===btn){closeFaces();return}closeFaces();faceAnchor=btn;faceTarget=btn.closest('form')?.querySelector('textarea[name=body]');if(!faceTarget)return;el.hidden=false;btn.setAttribute('aria-expanded','true');renderFaces();positionFaces();$('#faceSearch').focus({preventScroll:true})}

function setFaceCategory(c){faceCategory=c;renderFaces()}

function renderFaces(){let el=$('#faces');if(!el)return;el.innerHTML='<div class="face-head"><strong>Emotikony tekstowe</strong><span class="meta">'+faces.length+' emotikon</span></div><input id="faceSearch" class="face-search" placeholder="Szukaj: lenny, shrug, radość…" value="'+esc(faceQuery)+'" oninput="searchFaces(event)"><div class="face-categories">'+['Ostatnie','Wszystkie',...Object.keys(faceGroups)].map(c=>'<button type="button" class="'+(c===faceCategory?'active':'')+'" data-category="'+esc(c)+'" onclick="setFaceCategory(this.dataset.category)">'+esc(c)+'</button>').join('')+'</div><div class="face-grid" id="faceItems"></div>';renderFaceItems()}
function renderFaceItems(){let list=faceCategory==='Ostatnie'?recentFaces.filter(f=>faces.includes(f)):faceCategory==='Wszystkie'?faces:faceGroups[faceCategory]||[];let q=faceQuery.trim().toLowerCase();if(q){let aliases={shrug:'¯\\_(ツ)_/¯',lenny:'( ͡° ͜ʖ ͡°)',tableflip:'(╯°□°）╯︵ ┻━┻',bear:'ʕ•ᴥ•ʔ',cat:'ฅ^•ﻌ•^ฅ',sunglasses:'(⌐■_■)'};list=list.filter(f=>f.toLowerCase().includes(q)||Object.entries(faceGroups).some(([c,a])=>c.toLowerCase().includes(q)&&a.includes(f))||Object.entries(aliases).some(([k,v])=>k.includes(q)&&v===f))}$('#faceItems').innerHTML=list.length?list.map(f=>'<button type="button" title="'+esc(f)+'" onclick="addFace('+faces.indexOf(f)+')">'+esc(f)+'</button>').join(''):'<p class="meta" style="padding:12px">Brak emotikon.</p>'}
function addFace(i){let f=faces[i];if(!f||!faceTarget?.isConnected)return;insert(f,faceTarget);recentFaces=[f,...recentFaces.filter(x=>x!==f)].slice(0,30);try{localStorage.setItem('przekop-recent-faces',JSON.stringify(recentFaces))}catch{}closeFaces()}
function toggleAdult(){drafts[mode].adult=!drafts[mode].adult;persistDraft();let b=$('#adultToggle');b.setAttribute('aria-pressed',String(!!drafts[mode].adult));syncEditor()}

function addPollOption(){let p=drafts[mode].poll;if(p.options.length<6){p.options.push('');persistDraft();renderEditor()}}
function removePollOption(i){let p=drafts[mode].poll;if(p.options.length>2){p.options.splice(i,1);persistDraft();renderEditor()}}
function pollEditor(d){if(!d.poll)return '';return '<section class="poll-edit"><div class="row between"><h3>Ankieta</h3><button type="button" class="cancel-reply" onclick="togglePoll()">Usuń</button></div><div class="field"><label>Pytanie</label><input maxlength="160" placeholder="O co chcesz zapytać?" value="'+esc(d.poll.question)+'" oninput="pollField(event,-1)"></div>'+d.poll.options.map((x,i)=>'<div class="field"><div class="row"><input maxlength="100" placeholder="Odpowiedź '+(i+1)+'" value="'+esc(x)+'" oninput="pollField(event,'+i+')">'+(d.poll.options.length>2?'<button type="button" aria-label="Usuń odpowiedź" onclick="removePollOption('+i+')">✕</button>':'')+'</div></div>').join('')+'<button type="button" class="secondary" onclick="addPollOption()" '+(d.poll.options.length>=6?'disabled':'')+'>+ Dodaj odpowiedź</button></section>'}
function editorTools(d,link,context='post'){return '<div class="toolbar"><div class="editor-tools"><button type="button" title="Pogrubienie" aria-label="Pogrubienie" onclick="formatText(\'**\',this)"><b>B</b></button><button type="button" title="Kursywa" aria-label="Kursywa" onclick="formatText(\'*\',this)"><i>I</i></button><button type="button" title="Przekreślenie" aria-label="Przekreślenie" onclick="formatText(\'~~\',this)"><s>S</s></button><button type="button" title="Cytat" aria-label="Cytat" onclick="formatText(\'>\',this)">❝</button><button type="button" title="Kod" aria-label="Kod" onclick="formatText(\'code\',this)">&lt;/&gt;</button><span class="tool-divider"></span><button type="button" class="face-toggle" title="Kaomoji" aria-label="Wybierz emotikonę" aria-expanded="false" aria-controls="faces" onclick="toggleFaces(this)">( ͡° ͜ʖ ͡°)</button>'+(context==='post'?'<button type="button" id="adultToggle" aria-pressed="'+!!d.adult+'" title="Treść 18+" onclick="toggleAdult()">18+</button>'+(!link?'<button type="button" aria-pressed="'+!!d.poll+'" title="Ankieta" onclick="togglePoll()"><svg viewBox="0 0 24 24"><path d="M5 20V12h3v8M11 20V5h3v15M17 20V9h3v11"/></svg></button>':'')+'':'')+'</div><span class="editor-counter" '+(context==='post'?'id="counter"':'')+'>0 / '+(context==='comment'?2000:context==='post'?5000:3000)+'</span></div>'+(context==='post'?pollEditor(d):'')}
function renderEditor(){let d=drafts[mode],link=mode==='link';$('#main').innerHTML='<div class="page-head"><h1>Dodaj publikację</h1><a class="back" style="margin:0" href="#home">Anuluj</a></div><form class="editor" onsubmit="publish(event)"><div class="editor-tabs"><button type="button" class="'+(!link?'active':'')+'" onclick="switchMode(\'text\')">'+I('edit')+' Wpis</button><button type="button" class="'+(link?'active':'')+'" onclick="switchMode(\'link\')">'+I('link')+' Link</button></div><div class="editor-main"><div class="row between">'+user('me')+'<span class="meta">Publiczny</span></div>'+(link?'<div class="field"><label for="url">Link</label><input id="url" name="url" type="url" placeholder="https://…" value="'+esc(d.url)+'" oninput="changeDraft(event)"><div id="linkPreview">'+linkCard(d)+'</div></div><div class="field"><label for="title">Tytuł</label><input id="title" name="title" maxlength="180" placeholder="Tytuł linku" value="'+esc(d.title)+'" oninput="changeDraft(event)"></div>':'')+'<div class="field"><label for="body">'+(link?'Opis <small>· opcjonalny</small>':'Treść')+'</label><textarea id="body" name="body" maxlength="5000" placeholder="'+(link?'Dodaj kontekst lub własny komentarz…':'Co chcesz opublikować?')+'" oninput="changeDraft(event)">'+esc(d.body)+'</textarea>'+editorTools(d,link)+'</div>'+(link?'<div class="field"><label for="tags">Tagi</label><input id="tags" name="tags" placeholder="#technologia #ciekawostki" value="'+esc(d.tags)+'" oninput="changeDraft(event)"><span class="hint">Przynajmniej jeden tag. Oddziel spacją lub przecinkiem.</span></div>':'')+'<div class="field"><label>Zdjęcie <small>· opcjonalne</small></label><label class="drop" for="file">'+I('image')+'<span>Wybierz zdjęcie<br><span class="hint">JPG, PNG, GIF, WebP · do 1,5 MB</span></span></label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="attach(event)">'+(d.image?'<img class="post-img" src="'+esc(d.image)+'" alt="Podgląd zdjęcia"><button type="button" class="secondary" onclick="removeImage()">Usuń zdjęcie</button>':'')+'</div><p class="error" id="editorError" role="status"></p></div><div class="editor-footer"><button type="button" class="secondary" onclick="preview()">Podgląd</button><button id="publish" class="primary">'+(link?'Dodaj link':'Opublikuj wpis')+'</button></div></form><div id="preview"></div>';syncEditor()}
function renderStyleguide(){const samples=[['majster','new'],['kawa_i_kod','user'],['analogowy','ranked'],['moderacja','staff'],['studio_pixel','brand'],['nieaktywny','banned']];let sw=[['#2D3142','Jet Black'],['#4F5D75','Blue Slate'],['#BFC0C0','Silver'],['#FFFFFF','White'],['#EF8354','Coral Glow']];let section=(title,body)=>'<section class="guide-section"><h2>'+title+'</h2>'+body+'</section>';$('#main').innerHTML='<div class="page-head"><h1>Style guide</h1><button class="secondary" onclick="document.querySelector(\'#theme\').click()">Zmień motyw</button></div>'+section('Kolory', '<div class="guide-swatch-grid">'+sw.map(([c,n])=>'<div class="guide-swatch"><div style="background:'+c+'"></div><small>'+n+'<br>'+c+'</small></div>').join('')+'</div>')+section('Typografia','<div class="guide-stack"><div class="guide-sample"><h1>Nagłówek H1</h1><small>26 px / 780</small></div><div class="guide-sample"><h2>Nagłówek H2</h2><small>19 px / 700</small></div><div class="guide-sample"><h3>Nagłówek H3</h3><small>15 px</small></div><div class="guide-sample"><h4>Nagłówek H4</h4><h5>Nagłówek H5</h5><h6>Nagłówek H6</h6><p class="body">Przykładowy tekst wpisu. Zażółć gęślą jaźń. 0123456789. Dłuższy akapit pozwala sprawdzić interlinię, długość wiersza i czytelność tekstu.</p><p><strong>Tekst pogrubiony</strong> · <em>Kursywa</em> · <u>Podkreślenie</u> · <s>Przekreślenie</s></p><p class="meta">Metadane · 2 godz. temu</p><p>'+rich('https://example.org #technologia @analogowy')+'</p><blockquote>Przykładowy cytat w tekście.</blockquote><ul><li>Lista punktowana</li><li>Drugi element</li></ul><ol><li>Lista numerowana</li><li>Drugi element</li></ol><p>Kod inline: <code>const x = 1;</code></p><pre><code>function hello() {\n  return "Cześć!";\n}</code></pre><table><thead><tr><th>Element</th><th>Wartość</th></tr></thead><tbody><tr><td>Wpisy</td><td>128</td></tr><tr><td>Komentarze</td><td>42</td></tr></tbody></table></div></div>')+section('Nicki i avatary','<div class="role-list">'+samples.map(([u,r])=>'<div class="row between">'+user(u)+'<span class="role-label">'+roles[r]+'</span></div>').join('')+'</div>')+section('Przyciski i ikony','<div class="guide-stack"><div class="row"><button class="primary" onclick="toast(\'Przycisk główny\')">Opublikuj</button><button class="secondary" onclick="toast(\'Przycisk dodatkowy\')">Anuluj</button><button class="primary" disabled>Nieaktywny</button><button class="icon-btn" onclick="toast(\'Przycisk ikony\')" aria-label="Zapisz">'+I('bookmark')+'</button></div><div class="guide-icon-grid">'+Object.keys(paths).map(k=>'<span title="'+k+'">'+I(k)+'</span>').join('')+'</div><div class="feed-tabs"><button class="active" onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Wszystkie</button><button onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Wpisy</button><button onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Linki</button></div></div>')+section('Formularze','<div class="guide-stack"><label>Pole tekstowe<br><input placeholder="Wpisz tekst"></label><label>Pole nieaktywne<br><input disabled placeholder="Niedostępne"></label><label>Wybór<br><select><option>Najnowsze</option><option>Najlepsze</option></select></label><label><input type="checkbox"> Opcja wyboru</label><div class="row"><label><input type="radio" name="guide-choice" checked> Opcja A</label><label><input type="radio" name="guide-choice"> Opcja B</label></div><label>Treść<br><textarea rows="3" placeholder="Napisz coś…"></textarea></label><p class="error">Przykładowy komunikat walidacji.</p><div class="guide-notice">Przykładowe powiadomienie.</div></div>')+section('Wpis i link',state.posts.slice(0,2).map(p=>post(p,true)).join(''))+section('Komentarze','<p class="meta" style="margin-bottom:10px">Skróty klawiaturowe: Enter wysyła, Shift + Enter lub Ctrl + Enter dodaje nową linię. Szybkie wysyłanie można wyłączyć w ustawieniach.</p><div class="comments">'+discussionControls(2)+commentForm(0,'',true)+'<div class="comment">'+user('analogowy')+'<p>Przykładowy komentarz z '+rich('#tagiem')+'.</p><div class="comment-actions"><div class="votes">'+I('up')+' 21 '+I('down')+'</div><button type="button" class="reply-btn thread-toggle" aria-expanded="true" onclick="toggleThread(this)">'+I('down')+' <span>Zwiń odpowiedzi (1)</span></button></div>'+commentForm(0,'0',true)+'<div class="thread-replies" data-count-value="1"><div class="comment">'+user('kawa_i_kod')+'<p>Przykładowa odpowiedź.</p></div></div></div></div>')+section('Górna belka i liczniki','<p class="meta" style="margin-bottom:12px">Górna belka jest przypięta do okna podczas przewijania, na desktopie i telefonie.</p><div class="guide-header-sample"><button class="icon-btn" onclick="messagePopup()" aria-label="Wiadomości">'+I('mail')+counterHTML(1)+'</button><button class="icon-btn" onclick="notificationPopup()" aria-label="Powiadomienia">'+I('bell')+counterHTML(12)+'</button><span class="icon-btn">'+I('bell')+counterHTML(100)+'</span>'+avatar('me')+'<a class="primary header-add" href="#compose"><span class="add-glyph">'+I('edit')+'</span><span class="add-label">Dodaj</span></a></div><div class="row" style="margin-top:15px"><button class="secondary" onclick="accountPopup()">Menu konta</button><button class="secondary" onclick="notificationPopup()">Powiadomienia</button></div>')+section('Wiadomości prywatne i edytor','<div class="chat-log" style="min-height:0;padding-top:0"><div class="chat-bubble">Cześć! <small>12:30</small></div><div class="chat-bubble mine">'+rich('**Cześć!** ( ͡° ͜ʖ ͡°)')+'<small>12:31</small></div></div>'+messageComposer('guide'))+section('Popularność publikacji','<div class="guide-stack">'+[24,76,128].map(n=>'<div class="post '+(n>=100?'post-blazing':'')+'"><div class="actions" style="margin:0"><div class="votes '+(n>=50?'votes-hot':'')+' '+(n>=100?'votes-blazing':'')+'">'+I('up')+'<span class="vote-score">'+(n>=50?'<span class="heat-icon">'+I('flame')+'</span>':'')+n+'</span>'+I('down')+'</div><span class="meta">'+(n>=100?'Bardzo popularna':n>=50?'Popularna':'Standardowa')+'</span></div></div>').join('')+'</div>')+section('Katalog społeczności','<div class="directory-row"><a class="directory-tag" href="#tags"><span class="directory-symbol">'+I('hash')+'</span><span><strong>#technologia</strong><small>12 publikacji</small></span></a><a class="secondary" href="#tags">Katalog tagów</a></div><div class="directory-row"><span class="directory-rank">01</span><div class="directory-person">'+user('analogowy')+'<small>5 publikacji · 12 komentarzy</small></div><strong class="directory-points">128 pkt</strong></div><a class="back" href="#ranking">Zobacz ranking</a>')+section('Podgląd zdjęć','<img class="post-img" tabindex="0" role="button" aria-label="Powiększ próbkę" alt="Próbka palety Przekopu" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27640%27 height=%27210%27%3E%3Crect width=%27640%27 height=%27210%27 fill=%27%232d3142%27/%3E%3Ccircle cx=%27320%27 cy=%27105%27 r=%2765%27 fill=%27%23ef8354%27/%3E%3C/svg%3E">')+section('Profil użytkownika',profileHero('analogowy',true)+'<nav class="profile-tabs"><a class="active" href="#profile/analogowy">Publikacje</a><a href="#profile/analogowy/comments">Komentarze</a><a href="#profile/analogowy/followers">Obserwujący</a></nav>')+section('Stopka','<div class="footer-inner"><a class="footer-brand" href="#home">przekop<span>.</span></a><nav><a href="#about">O serwisie</a><a href="#rules">Zasady społeczności</a><a href="#styleguide">Style guide</a></nav><small>© 2026 Przekop</small></div>')+section('Okna dialogowe i nawigacja','<div class="row"><button class="secondary" onclick="actionDialog({title:\'Zgłoś treść\',kind:\'report\',confirm:\'Zgłoś\'})">Zgłoszenie</button><button class="secondary" onclick="actionDialog({title:\'Edytuj treść\',kind:\'text\',value:\'Przykładowy tekst\',confirm:\'Zapisz\'})">Edycja</button><button class="primary danger-button" onclick="actionDialog({title:\'Usunąć treść?\',text:\'Tej operacji nie można cofnąć.\',danger:true,confirm:\'Usuń\'})">Usuwanie</button></div><p class="meta" style="margin-top:10px">Przycisk powrotu na górę jest dostępny po przewinięciu strony.</p>')+section('Karta użytkownika','<p class="meta" style="margin-bottom:12px">Najedź na nick lub avatar w publikacji.</p><div class="user-card-example">'+userCard('analogowy')+'</div>')+section('Wzmianki i tagi','<p class="body">'+rich('Wpisz @analogowy lub #technologia.')+'</p><p class="meta">Podpowiedzi działają w edytorze publikacji, komentarza i wiadomości.</p>'+commentForm(0,'',true))+section('Logowanie i rejestracja',authMarkup('login',true)+'<div class="row"><a class="secondary" href="#register">Rejestracja</a><a class="secondary" href="#reset">Reset hasła</a></div>')+section('Moderacja',modCard({rid:'sample',id:1,path:'',why:'Przykładowe zgłoszenie',status:'dismissed',created:'Przykład'})+'<a class="secondary" href="#moderation">Otwórz panel moderacji</a>')+section('Długie publikacje','<div class="post">'+longText(('Przykładowy akapit dłuższej publikacji. Zwijanie pomaga zachować czytelność feedu. \n').repeat(16),'guide:long')+'</div>')+section('Podgląd linku',linkCard({url:'https://example.org/archiwum/artykul',title:'Przykładowy artykuł z długim tytułem'}))+section('Preferencje i wyciszanie','<div class="guide-stack"><a class="secondary" href="#settings">Ustawienia prywatności i powiadomień</a><div class="row">'+tagMuteButton('przyklad')+'<button class="muted-chip" data-mute-tag="przyklad">#przyklad '+I('close')+'</button></div></div>')+section('Filtry feedu i kolekcje',feedTools('hot')+'<div class="collection-bar"><div class="collection-tabs"><button class="active">'+I('bookmark')+' Wszystkie <small>8</small></button><button>'+I('folder')+' Do przeczytania <small>3</small></button></div><a class="secondary" href="#saved">Zapisane</a></div>')+section('Skróty klawiaturowe',keyboardHelp()+'<button class="secondary" onclick="openKeyboardHelp()">Otwórz pomoc</button>');let f=$('#guideChatForm');if(f){editorInput($('#body'));f.onsubmit=e=>{e.preventDefault();toast('Wiadomość testowa');e.target.reset();editorInput($('#body'))}}}
function render(){closeFaces();closeSuggestions();hideUserCard();let r=route(),[view,param,tab]=r.split('/');document.body.classList.toggle('profile-view',view==='profile');chrome(r);if(view==='profile'){renderProfile(param,tab);return}if(view==='about'||view==='rules'){infoPage(view);return}if(view==='moderation'){moderationPage();return}if(view==='notifications'){renderNotifications();return}if(view==='messages'){renderMessages(param);return}if(['settings','statistics','blocked'].includes(view)){settingsPage(view);return}if(['login','register','reset'].includes(view)){authPage(view);return}if(view==='search'){renderSearch(r.slice(7));return}if(view==='tags'||view==='ranking'){directoryPage(view);return}if(view==='roles'||view==='styleguide'){renderStyleguide();return}if(view==='compose'){if(requireAccount())renderEditor();return}if(!logged()&&['saved','following'].includes(view)){requireAccount();return}if(view==='post'){let p=state.posts.find(p=>p.id===+param&&!ui.blocked.includes(p.user));if(!p){$('#main').innerHTML='<div class="empty">Nie znaleziono wpisu.</div>';return}$('#main').innerHTML='<a class="back" href="#home">'+I('back')+' Wróć do feedu</a>'+post(p)+'<section class="comments">'+discussionControls(count(p.comments))+commentForm(p.id)+discussionList(p)+'</section>';return}
let list=state.posts.filter(p=>visiblePost(p,view==='tag'||view==='saved')),title={home:'Główna',hot:'Gorące',new:'Najnowsze',following:'Obserwowane',saved:'Zapisane',tag:'#'+param,profile:'Profil'}[view]||'Główna';if(view==='home')list=list.filter(p=>score(p)>=30);if(view==='hot')list=list.filter(p=>periodMatch(p,hotPeriod)).sort((a,b)=>score(b)-score(a));if(view==='new')list.sort((a,b)=>postDate(b)-postDate(a));if(view==='following')list=list.filter(p=>state.followUsers.includes(p.user)||p.tags.some(t=>state.followTags.includes(t)));if(view==='saved'){let c=ui.collections.find(x=>x.id===collectionFilter);list=list.filter(p=>state.saved.includes(p.id)&&(!c||c.posts.includes(p.id)))}if(view==='tag')list=list.filter(p=>p.tags.includes(param));if(view==='profile')list=list.filter(p=>p.user===param);if(filter!=='all')list=list.filter(p=>p.kind===filter);if(sort==='score')list.sort((a,b)=>score(b)-score(a));if(sort==='new')list.sort((a,b)=>postDate(b)-postDate(a));
let action=view==='tag'?'<div class="row">'+tagMuteButton(param)+'<button class="secondary" id="followBtn">'+(state.followTags.includes(param)?'Obserwujesz':'Obserwuj')+'</button></div>':'<select class="select" aria-label="Sortowanie" onchange="sort=this.value;render()"><option value="default" '+(sort==='default'?'selected':'')+'>Domyślnie</option><option value="new" '+(sort==='new'?'selected':'')+'>Najnowsze</option><option value="score" '+(sort==='score'?'selected':'')+'>Najlepsze</option></select>';
let head='<div class="page-head"><h1>'+esc(title)+'</h1>'+action+'</div>'+(view==='tag'&&ui.mutedTags.includes(param)?'<p class="muted-notice">Ten tag jest wyciszony w Twoim feedzie.</p>':'');
$('#main').innerHTML=head+(view==='saved'?collectionTabs():'')+'<div class="feed-tabs">'+[['all','Wszystkie'],['text','Wpisy'],['link','Linki']].map(([k,l])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+l+'</button>').join('')+'</div>'+feedTools(view)+(list.length?list.map(p=>post(p,false,view==='hot'||view==='new')).join(''):'<div class="empty">Brak publikacji spełniających wybrane filtry.</div>');let f=$('#followBtn');if(f)f.onclick=()=>follow(view==='tag'?'tag':'user',param)}
document.addEventListener('keydown',commentEnter);$('#imageDialog').addEventListener('click',e=>{if(e.target===$('#imageDialog'))closeImage()});$('#backTop').innerHTML=I('up');$('#backTop').onclick=()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',()=>{$('#backTop').hidden=window.scrollY<650},{passive:true});$('#logo').innerHTML=I('logo');$('#searchWrap').insertAdjacentHTML('afterbegin',I('search'));$('#search').oninput=searchSuggestions;$('#search').onfocus=searchSuggestions;$('#headerProfile').onclick=accountPopup;$('#messagesNav').onclick=e=>{e.preventDefault();messagePopup()};$('#notificationsNav').onclick=e=>{e.preventDefault();notificationPopup()};document.addEventListener('click',e=>{let b=e.target.closest('[data-thread]');if(b)startThread(b.dataset.thread)});$('#theme').onclick=()=>{state.dark=!state.dark;save();chrome(route())};window.onhashchange=()=>{closePopup();closeFaces();focusedPost=null;discussionSort='default';if(!route().startsWith('search/'))$('#search').value='';filter='all';sort='default';window.scrollTo(0,0);render()};render();
</script></body></html>
