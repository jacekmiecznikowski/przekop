function renderStyleguide(){const samples=[['majster','new'],['kawa_i_kod','user'],['analogowy','ranked'],['moderacja','staff'],['studio_pixel','brand'],['nieaktywny','banned']];let sw=[['#2D3142','Jet Black'],['#4F5D75','Blue Slate'],['#BFC0C0','Silver'],['#FFFFFF','White'],['#EF8354','Coral Glow']];let section=(title,body)=>'<section class="guide-section"><h2>'+title+'</h2>'+body+'</section>';$('#main').innerHTML='<div class="page-head"><h1>Style guide</h1><button class="secondary" onclick="document.querySelector(\'#theme\').click()">Zmień motyw</button></div>'+section('Kolory', '<div class="guide-swatch-grid">'+sw.map(([c,n])=>'<div class="guide-swatch"><div style="background:'+c+'"></div><small>'+n+'<br>'+c+'</small></div>').join('')+'</div>')+section('Typografia','<div class="guide-stack"><div class="guide-sample"><h1>Nagłówek H1</h1><small>26 px / 780</small></div><div class="guide-sample"><h2>Nagłówek H2</h2><small>19 px / 700</small></div><div class="guide-sample"><h3>Nagłówek H3</h3><small>15 px</small></div><div class="guide-sample"><h4>Nagłówek H4</h4><h5>Nagłówek H5</h5><h6>Nagłówek H6</h6><p class="body">Przykładowy tekst wpisu. Zażółć gęślą jaźń. 0123456789. Dłuższy akapit pozwala sprawdzić interlinię, długość wiersza i czytelność tekstu.</p><p><strong>Tekst pogrubiony</strong> · <em>Kursywa</em> · <u>Podkreślenie</u> · <s>Przekreślenie</s></p><p class="meta">Metadane · 2 godz. temu</p><p>'+rich('https://example.org #technologia @analogowy')+'</p><blockquote>Przykładowy cytat w tekście.</blockquote><ul><li>Lista punktowana</li><li>Drugi element</li></ul><ol><li>Lista numerowana</li><li>Drugi element</li></ol><p>Kod inline: <code>const x = 1;</code></p><pre><code>function hello() {\n  return "Cześć!";\n}</code></pre><table><thead><tr><th>Element</th><th>Wartość</th></tr></thead><tbody><tr><td>Wpisy</td><td>128</td></tr><tr><td>Komentarze</td><td>42</td></tr></tbody></table></div></div>')+section('Nicki i avatary','<div class="role-list">'+samples.map(([u,r])=>'<div class="row between">'+user(u)+'<span class="role-label">'+roles[r]+'</span></div>').join('')+'</div>')+section('Przyciski i ikony','<div class="guide-stack"><div class="row"><button class="primary" onclick="toast(\'Przycisk główny\')">Opublikuj</button><button class="secondary" onclick="toast(\'Przycisk dodatkowy\')">Anuluj</button><button class="primary" disabled>Nieaktywny</button><button class="icon-btn" onclick="toast(\'Przycisk ikony\')" aria-label="Zapisz">'+I('bookmark')+'</button></div><div class="guide-icon-grid">'+Object.keys(paths).map(k=>'<span title="'+k+'">'+I(k)+'</span>').join('')+'</div><div class="feed-tabs"><button class="active" onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Wszystkie</button><button onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Wpisy</button><button onclick="this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.toggle(\'active\',b===this))">Linki</button></div></div>')+section('Formularze','<div class="guide-stack"><label>Pole tekstowe<br><input placeholder="Wpisz tekst"></label><label>Pole nieaktywne<br><input disabled placeholder="Niedostępne"></label><label>Wybór<br><select><option>Najnowsze</option><option>Najlepsze</option></select></label><label><input type="checkbox"> Opcja wyboru</label><div class="row"><label><input type="radio" name="guide-choice" checked> Opcja A</label><label><input type="radio" name="guide-choice"> Opcja B</label></div><label>Treść<br><textarea rows="3" placeholder="Napisz coś…"></textarea></label><p class="error">Przykładowy komunikat walidacji.</p><div class="guide-notice">Przykładowe powiadomienie.</div></div>')+section('Wpis i link',state.posts.slice(0,2).map(p=>post(p,true)).join(''))+section('Komentarze','<div class="comments"><h3>Komentarze</h3><form class="comment-form" onsubmit="event.preventDefault();toast(\'Przykładowy komentarz\')"><textarea rows="2" placeholder="Dodaj komentarz…" required oninput="this.form.querySelector(\'button[type=submit]\').disabled=!this.value.trim()"></textarea><div class="comment-form-actions"><button class="primary" type="submit" disabled>Dodaj komentarz</button></div></form><div class="comment">'+user('analogowy')+'<p>Przykładowy komentarz z '+rich('#tagiem')+'.</p><div class="comment-actions"><div class="votes"><button onclick="this.classList.toggle(\'selected\')" aria-label="Plus">'+I('up')+'</button>21<button onclick="this.classList.toggle(\'selected\')" aria-label="Minus">'+I('down')+'</button></div><button class="reply-btn" onclick="this.parentElement.nextElementSibling.hidden=!this.parentElement.nextElementSibling.hidden">Odpowiedz</button></div><form class="comment-form reply-form" onsubmit="event.preventDefault();toast(\'Przykładowa odpowiedź\')"><textarea rows="2" placeholder="Napisz odpowiedź…" required oninput="this.form.querySelector(\'button[type=submit]\').disabled=!this.value.trim()"></textarea><div class="comment-form-actions"><button type="button" class="cancel-reply" onclick="this.form.hidden=true">Anuluj</button><button class="primary" type="submit" disabled>Odpowiedz</button></div></form><div class="comment">'+user('kawa_i_kod')+'<p>Przykładowa zagnieżdżona odpowiedź.</p></div></div></div>')}
function render(){let r=route(),[view,param]=r.split('/');chrome(r);if(view==='roles'||view==='styleguide'){renderStyleguide();return}if(view==='compose'){renderEditor();return}if(view==='post'){let p=state.posts.find(p=>p.id===+param);if(!p){$('#main').innerHTML='<div class="empty">Nie znaleziono wpisu.</div>';return}$('#main').innerHTML='<a class="back" href="#home">'+I('back')+' Wróć do feedu</a>'+post(p)+'<section class="comments"><h3>Komentarze ('+count(p.comments)+')</h3>'+commentForm(p.id)+''+p.comments.map((c,i)=>commentHTML(c,p.id,String(i))).join('')+'</section>';return}
let list=[...state.posts],title={home:'Główna',hot:'Gorące',new:'Najnowsze',following:'Obserwowane',saved:'Zapisane',tag:'#'+param,profile:'Profil'}[view]||'Główna';if(view==='home')list=list.filter(p=>score(p)>=30);if(view==='hot')list.sort((a,b)=>score(b)-score(a));if(view==='new')list.sort((a,b)=>b.id-a.id);if(view==='following')list=list.filter(p=>state.followUsers.includes(p.user)||p.tags.some(t=>state.followTags.includes(t)));if(view==='saved')list=list.filter(p=>state.saved.includes(p.id));if(view==='tag')list=list.filter(p=>p.tags.includes(param));if(view==='profile')list=list.filter(p=>p.user===param);if(query)list=list.filter(p=>[p.title,p.body,p.user,...p.tags].join(' ').toLowerCase().includes(query.toLowerCase()));if(filter!=='all')list=list.filter(p=>p.kind===filter);if(sort==='score')list.sort((a,b)=>score(b)-score(a));if(sort==='new')list.sort((a,b)=>b.id-a.id);
let action=view==='tag'?'<button class="secondary" id="followBtn">'+(state.followTags.includes(param)?'Obserwujesz':'Obserwuj')+'</button>':'<select class="select" aria-label="Sortowanie" onchange="sort=this.value;render()"><option value="default" '+(sort==='default'?'selected':'')+'>Domyślnie</option><option value="new" '+(sort==='new'?'selected':'')+'>Najnowsze</option><option value="score" '+(sort==='score'?'selected':'')+'>Najlepsze</option></select>';
let head='<div class="page-head"><h1>'+esc(title)+'</h1>'+action+'</div>';
if(view==='profile'){head='<div class="profile"><div class="profile-cover"></div><div class="profile-inner">'+avatar(param||'me')+'<div class="row between"><h1>'+nick(param)+'</h1>'+(param!=='me'&&role(param)!=='banned'?'<button class="secondary" id="followBtn">'+(state.followUsers.includes(param)?'Obserwujesz':'Obserwuj')+'</button>':'')+'</div><div class="role-label">'+roles[role(param)]+'</div><div class="stats"><span><b>'+state.posts.filter(p=>p.user===param).length+'</b> publikacji</span><span><b>'+state.posts.filter(p=>p.user===param).reduce((n,p)=>n+score(p),0)+'</b> punktów</span></div></div></div>'}
$('#main').innerHTML=head+'<div class="feed-tabs">'+[['all','Wszystkie'],['text','Wpisy'],['link','Linki']].map(([k,l])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+l+'</button>').join('')+'</div>'+(list.length?list.map(p=>post(p,false,view==='hot'||view==='new')).join(''):'<div class="empty">Brak publikacji.</div>');let f=$('#followBtn');if(f)f.onclick=()=>follow(view==='tag'?'tag':'user',param)}
$('#logo').innerHTML=I('logo');$('#searchWrap').insertAdjacentHTML('afterbegin',I('search'));$('#search').oninput=e=>{query=e.target.value;if(route().startsWith('compose')||route().startsWith('post/'))go('home');else render()};$('#theme').onclick=()=>{state.dark=!state.dark;save();chrome(route())};window.onhashchange=()=>{filter='all';sort='default';window.scrollTo(0,0);render()};render();
</script></body></html>
