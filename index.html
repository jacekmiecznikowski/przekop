const seed=[{id:1,user:'analogowy',time:'2 godz.',title:'Internet, który warto odkrywać na nowo',body:'Znalazłem katalog małych, niezależnych stron internetowych. Bez reklam, bez nieskończonego scrollowania. Po prostu ludzie i ich pasje.',url:'https://neocities.org',tags:['internet','ciekawostki'],score:184,comments:[{user:'kawa',body:'Tęsknię za takim internetem.',replies:[{user:'analogowy',body:'Wciąż istnieje, tylko trzeba go znaleźć.'}]}]},{id:2,user:'kawa',time:'36 min',title:'',body:'Po trzech miesiącach prób upiekłem pierwszy naprawdę dobry chleb na zakwasie. Największa zmiana? Przestałem się spieszyć. Macie jakieś sprawdzone patenty?',tags:['gotowanie','chwalesie'],score:72,comments:[{user:'mlynarz',body:'Długi odpoczynek ciasta robi ogromną różnicę.'}]},{id:3,user:'orbit',time:'4 godz.',title:'Zobacz Wszechświat w niespotykanej dotąd skali',body:'Warto zajrzeć do publicznego archiwum zdjęć teleskopu Webba. Można spędzić tam cały wieczór.',url:'https://webbtelescope.org',tags:['nauka','kosmos'],score:126,comments:[]},{id:4,user:'majster',time:'15 min',title:'',body:'Pokażcie swoje projekty DIY. Ja właśnie skończyłem pierwszą lampę z drewna odzyskanego ze starego biurka.',tags:['tworczosc','diy'],score:12,comments:[]}];
let state;try{state=JSON.parse(localStorage.getItem('przestrzen-v1'))}catch{}state=state||{posts:seed,votes:{},saved:[],follow:['kawa','internet'],dark:false};let filter='all',query='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem('przestrzen-v1',JSON.stringify(state)),go=s=>{location.hash=s},route=()=>decodeURIComponent(location.hash.slice(1)||'home'),nav=[['home','⌂','Główna'],['hot','↗','Gorące'],['new','◷','Najnowsze'],['following','◎','Mój strumień'],['saved','◇','Zapisane'],['profile/me','○','Profil']];
const tags=t=>'<div class="tags">'+t.map(x=>'<button onclick="go(\'tag/'+encodeURIComponent(x)+'\')">#'+esc(x)+'</button>').join('')+'</div>';
function score(p){return p.score+(state.votes[p.id]||0)}function count(c){return c.reduce((n,x)=>n+1+count(x.replies||[]),0)}function author(u){return '<a class="row author" href="#profile/'+encodeURIComponent(u)+'"><span class="avatar">'+esc(u[0].toUpperCase())+'</span>'+esc(u)+'</a>'}function safeurl(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}}
function post(p,detail=false){let url=safeurl(p.url),v=state.votes[p.id]||0;return '<article class="post"><div class="vote"><button aria-label="Plus" class="'+(v===1?'on':'')+'" onclick="vote('+p.id+',1)">↑</button><span>'+score(p)+'</span><button aria-label="Minus" class="'+(v===-1?'on':'')+'" onclick="vote('+p.id+',-1)">↓</button></div><div><div class="row">'+author(p.user)+'<span class="meta">'+esc(p.time)+' · '+'Wpis'+'</span></div>'+(p.title?'<h2><a href="#post/'+p.id+'">'+esc(p.title)+'</a></h2>':'')+'<p>'+esc(p.body)+'</p>'+(url?'<a class="linkpreview" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span class="thumb">↗</span><span><strong>'+esc(p.title||new URL(url).hostname)+'</strong><br><small>'+esc(new URL(url).hostname)+' · Otwórz źródło ↗</small></span></a>':'')+(p.image?'<img class="cover" src="'+esc(p.image)+'" alt="Załącznik">':'')+tags(p.tags)+'<div class="actions"><button onclick="go(\'post/'+p.id+'\')">○ '+count(p.comments)+' komentarzy</button><button onclick="bookmark('+p.id+')">'+(state.saved.includes(p.id)?'◆ Zapisano':'◇ Zapisz')+'</button><button onclick="share('+p.id+')">↗ Udostępnij</button></div>'+(detail?'<div style="margin-top:30px"><h3>Dyskusja · '+count(p.comments)+'</h3><form onsubmit="comment(event,'+p.id+')"><input name="body" required placeholder="Dodaj komentarz…" style="width:100%;padding:12px;margin:12px 0;background:var(--paper);border:1px solid var(--line);border-radius:7px"><button class="primary">Odpowiedz</button></form>'+p.comments.map((c,i)=>commentView(c,p.id,String(i))).join('')+'</div>':'')+'</div></article>'}
function commentView(c,id,path){return '<div class="comment">'+author(c.user)+'<p>'+esc(c.body)+'</p><button class="muted" onclick="reply('+id+',\''+path+'\')">Odpowiedz ↳</button>'+(c.replies||[]).map((r,i)=>commentView(r,id,path+'.'+i)).join('')+'</div>'}
function vote(id,v){state.votes[id]=state.votes[id]===v?0:v;save();render()}function bookmark(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()}function share(id){const u=location.href.split('#')[0]+'#post/'+id;navigator.clipboard?.writeText(u).then(()=>alert('Skopiowano link')).catch(()=>prompt('Link do wpisu',u))||prompt('Link do wpisu',u)}function comment(e,id){e.preventDefault();state.posts.find(p=>p.id===id).comments.push({user:'me',body:e.target.body.value,replies:[]});save();render()}function reply(id,path){let b=prompt('Twoja odpowiedź');if(!b?.trim())return;let a=state.posts.find(p=>p.id===id).comments,c;for(let i of path.split('.')){c=a[+i];a=c.replies||(c.replies=[])}a.push({user:'me',body:b});save();render()}
let draft={title:'',body:'',url:'',tags:'',image:''};try{draft={...draft,...JSON.parse(sessionStorage.getItem('draft')||'{}')}}catch{}
function inlineTokens(s){return String(s||'').match(/(?:https?:\/\/|www\.)[^\s<>"']+|(?:^|[\s(])#[\p{L}\p{N}_]+/giu)||[]}
function inlineMode(){return inlineTokens(draft.title+' '+draft.body).length>0}
function tagList(s){return [...new Set((s.match(/(?:^|[\s,])#?[\p{L}\p{N}_]+/gu)||[]).map(x=>x.trim().replace(/^,?#?/,'').trim().toLowerCase()).filter(Boolean))]}

function modeError(){if(draft.url.trim()&&inlineMode())return 'Usuń linki i hashtagi z treści lub usuń link z panelu.';if(draft.url.trim()&&!safeurl(draft.url.trim()))return 'Podaj poprawny adres URL.';if(draft.url.trim()&&!tagList(draft.tags).length)return 'Dodaj przynajmniej jeden tag pod wpisem.';return ''}
function syncMode(){let inline=inlineMode(),panel=!!draft.url.trim(),url=$('#url'),tags=$('#tags'),hint=$('#modeHint'),badge=$('#modeBadge'),err=$('#modeError'),submit=$('#publishBtn');if(!url)return;url.disabled=inline&&!panel;tags.disabled=!panel;tags.required=panel;let tagButton=$('#tagButton');if(tagButton)tagButton.disabled=panel;badge.textContent=panel?'Link w panelu':inline?'Linki i tagi w treści':'Wpis';hint.textContent=panel?'Link dodany w panelu — tagi są wymagane poniżej, bez linków i hashtagów w treści.':inline?'Linki lub hashtagi są już w treści. Panel linku jest niedostępny.':'Możesz użyć linków i hashtagów w treści albo dodać link w panelu.';let error=modeError();err.textContent=error;err.hidden=!error;if(submit)submit.disabled=!!error;let preview=$('#draftPreview');if(preview)preview.innerHTML=''}
function updateDraft(e){let field=e.target.name,old=draft[field];draft[field]=e.target.value;if((field==='body'||field==='title')&&draft.url.trim()&&inlineMode()&&!inlineTokens((field==='body'?old:draft.body)+' '+(field==='title'?old:draft.title)).length){draft[field]=old;e.target.value=old;let err=$('#modeError');if(err){err.hidden=false;err.textContent='Usuń link z panelu, aby wstawić link lub hashtag w treści.'}return}sessionStorage.setItem('draft',JSON.stringify({...draft,image:''}));const n=$('#counter');if(n)n.textContent=draft.body.length+' / 5000';let p=$('#linkPreview'),u=safeurl(draft.url);if(p){p.hidden=!u;p.textContent=u?new URL(u).hostname+' ↗ '+u:''}syncMode()}
function renderComposer(){ $('#main').innerHTML='<div class="heading"><h1>Dodaj wpis</h1><a href="#home">✕ Zamknij</a></div><form class="composer" onsubmit="publish(event)"><div class="row between"><div class="row"><span class="avatar">M</span><div><strong>me</strong><br><small>Publiczny wpis</small></div></div><span class="modebadge" id="modeBadge">Wpis</span></div><div class="field"><label for="title">Tytuł <small>· opcjonalny</small></label><input id="title" name="title" maxlength="160" placeholder="Tytuł wpisu" value="'+esc(draft.title)+'" oninput="updateDraft(event)"></div><div class="field"><label for="body">Treść</label><textarea id="body" name="body" maxlength="5000" placeholder="Napisz coś…" oninput="updateDraft(event)">'+esc(draft.body)+'</textarea><div class="row between"><div class="tools"><button type="button" onclick="insertText(\'@\')">@ Wzmianka</button><button type="button" id="tagButton" onclick="insertText(\'#\')"># Tag</button></div><small id="counter">'+draft.body.length+' / 5000</small></div></div><div class="field"><label for="url">↗ Link <small>· opcjonalny</small></label><div class="modehint" id="modeHint"></div><input id="url" name="url" placeholder="https://…" value="'+esc(draft.url)+'" oninput="updateDraft(event)"><div class="preview" id="linkPreview" '+(safeurl(draft.url)?'':'hidden')+'>'+esc(safeurl(draft.url))+'</div></div><div class="field"><label for="image">Zdjęcie</label><input type="file" accept="image/*" id="image" onchange="attach(event)"><div id="imagePreview">'+(draft.image?'<img class="cover" src="'+esc(draft.image)+'" alt="Podgląd"><button type="button" onclick="draft.image=\'\';renderComposer()">Usuń zdjęcie</button>':'')+'</div></div><div class="field"><label for="tags">Tagi <small>· wymagane przy linku w panelu</small></label><input id="tags" name="tags" placeholder="#technologia #ciekawostki" value="'+esc(draft.tags)+'" oninput="updateDraft(event)"></div><div class="field"><small class="error" id="modeError" role="status" hidden></small></div><div class="composefoot row between"><button type="button" onclick="previewDraft()">Podgląd</button><button id="publishBtn" class="primary">Opublikuj wpis ↗</button></div><div id="draftPreview"></div></form>';syncMode()}
function insertText(t){let e=$('#body');e.setRangeText(t,e.selectionStart,e.selectionEnd,'end');updateDraft({target:e});e.focus()}

function draftPost(){return {id:Date.now(),user:'me',time:'teraz',title:draft.title.trim(),body:draft.body.trim(),url:safeurl(draft.url.trim()),image:draft.image,tags:draft.url.trim()?tagList(draft.tags):bodyTags(draft.title+' '+draft.body),score:0,comments:[]}}

function publish(e){e.preventDefault();if(modeError()){alert(modeError());return}let p=draftPost();if(!p.body&&!p.title&&!p.url&&!p.image){alert('Dodaj treść wpisu.');return}if(draft.url.trim()&&!p.url){alert('Podaj poprawny adres URL.');return}if(p.tags.includes('polityka')){alert('Tag #polityka jest niedostępny.');return}state.posts.unshift(p);try{save()}catch{state.posts.shift();alert('Brak miejsca w pamięci przeglądarki.');return}draft={title:'',body:'',url:'',tags:'',image:''};sessionStorage.removeItem('draft');go('new');render()}
function follow(u){state.follow=state.follow.includes(u)?state.follow.filter(x=>x!==u):[...state.follow,u];save();render()}
function render(){document.body.classList.toggle('dark',state.dark);let r=route(),[view,param]=r.split('/');$('#nav').innerHTML=nav.map(([key,icon,label])=>'<button class="'+(r===key?'active':'')+'" onclick="go(\''+key+'\')"><span>'+icon+'</span>'+label+'</button>').join('');$('#mobile').innerHTML=nav.slice(0,4).concat([nav[5]]).map(([k,i,l])=>'<button onclick="go(\''+k+'\')">'+i+' '+l+'</button>').join('');$('#sideTags').innerHTML=tags(['internet','nauka','gotowanie','diy']);$('#discover').innerHTML=tags(['kosmos','tworczosc','ciekawostki','chwalesie']);$('#trends').innerHTML=[...state.posts].sort((a,b)=>score(b)-score(a)).slice(0,3).map((p,i)=>'<a class="trend" href="#post/'+p.id+'"><b>0'+(i+1)+'</b><span>'+esc(p.title||p.body.slice(0,65))+'<br><small>'+score(p)+' punktów</small></span></a>').join('');
if(view==='compose'){renderComposer();return}let p=state.posts.find(x=>x.id===+param);if(view==='post'&&p){$('#main').innerHTML='<a class="muted" href="#home">← Powrót do strumienia</a><h1>Wpis</h1>'+post(p,true);return}
let titles={home:['Główna',''],hot:['Gorące',''],new:['Najnowsze',''],following:['Obserwowane',''],saved:['Zapisane',''],tag:['#'+param,''],profile:['Profil','']};let [title,sub]=titles[view]||titles.home;let list=[...state.posts];if(view==='home')list=list.filter(p=>score(p)>=30);if(view==='hot')list.sort((a,b)=>score(b)-score(a));if(view==='new')list.sort((a,b)=>b.id-a.id);if(view==='following')list=list.filter(p=>state.follow.includes(p.user)||p.tags.some(t=>state.follow.includes(t)));if(view==='saved')list=list.filter(p=>state.saved.includes(p.id));if(view==='tag')list=list.filter(p=>p.tags.includes(param));if(view==='profile')list=list.filter(p=>p.user===param);if(filter==='links')list=list.filter(p=>p.url);if(filter==='text')list=list.filter(p=>!p.url);if(query)list=list.filter(p=>[p.title,p.body,p.user,...p.tags].join(' ').toLowerCase().includes(query.toLowerCase()));
let heading='<div class="heading"><div><h1>'+esc(title)+'</h1><p class="muted">'+esc(sub)+'</p></div>'+(view==='tag'?'<button class="primary" onclick="follow('+JSON.stringify(param).replace(/"/g,'&quot;')+')">'+(state.follow.includes(param)?'Obserwujesz':'Obserwuj')+'</button>':'')+'</div>';
if(view==='profile')heading+='<div class="profile">'+author(param||'me')+'<h2 style="margin:12px 0">@'+esc(param)+'</h2><p class="muted"></p><div class="row between" style="margin-top:16px"><span>'+list.length+' publikacji · '+list.reduce((n,p)=>n+score(p),0)+' punktów</span><button class="primary" onclick="follow('+JSON.stringify(param).replace(/"/g,'&quot;')+')">'+(state.follow.includes(param)?'Obserwujesz':'Obserwuj')+'</button></div></div>';
let composer='';
$('#main').innerHTML=heading+composer+'<div class="tabs">'+[['all','Wszystko'],['links','Z linkiem'],['text','Bez linku']].map(([k,l])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+l+'</button>').join('')+'</div>'+(list.length?list.map(p=>post(p)).join(''):'<div class="empty">Tutaj jeszcze nic nie ma.</div>')}
$('#theme').onclick=()=>{state.dark=!state.dark;save();render()};$('#search').oninput=e=>{query=e.target.value;render()};window.onhashchange=()=>{filter='all';window.scrollTo(0,0);render()};render();
</script></body></html>
