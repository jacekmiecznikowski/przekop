const nav=[['home','home','Główna'],['hot','hot','Gorące'],['new','clock','Najnowsze'],['following','users','Obserwowane'],['saved','bookmark','Zapisane']];
function navHTML(items,r){return items.map(([k,i,l])=>'<a class="'+(r===k?'active':'')+'" href="#'+k+'">'+I(i)+'<span>'+l+'</span></a>').join('')}
function chrome(r){$('#nav').innerHTML=navHTML(nav,r);$('#addNav').innerHTML=I('plus')+' Dodaj';$('#mobile').innerHTML=navHTML(nav.slice(0,3),r)+'<a class="add" href="#compose">'+I('plus')+'Dodaj</a>'+navHTML([['profile/me','user','Profil']],r);$('#sideTags').innerHTML=state.followTags.map(t=>'<a class="side-tag" href="#tag/'+enc(t)+'">#'+esc(t)+'</a>').join('');$('#theme').innerHTML=I(state.dark?'sun':'moon');document.documentElement.dataset.theme=state.dark?'dark':'light';let trends=[...state.posts].sort((a,b)=>score(b)-score(a)).slice(0,3), tagCounts={};state.posts.forEach(p=>p.tags.forEach(t=>tagCounts[t]=(tagCounts[t]||0)+1));$('#aside').innerHTML='<section class="aside-box"><h3>Popularne tagi</h3>'+Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,n])=>'<a class="trend" href="#tag/'+enc(t)+'"><span>#'+esc(t)+'</span><small>'+n+' wpisów</small></a>').join('')+'</section><section class="aside-box"><h3>Popularne dyskusje</h3>'+trends.map((p,i)=>'<a class="trend" href="#post/'+p.id+'"><span>'+esc(p.title||p.body.slice(0,62))+'<small>'+count(p.comments)+' komentarzy · '+score(p)+' pkt</small></span><span class="rank">0'+(i+1)+'</span></a>').join('')+'</section>'}
function commentHTML(c,id,path){return '<div class="comment">'+user(c.user)+'<p>'+rich(c.body)+'</p><button class="reply-btn" onclick="openReply('+id+',\''+path+'\')">Odpowiedz</button><div id="reply-'+path.replaceAll('.','-')+'"></div>'+(c.replies||[]).map((x,i)=>commentHTML(x,id,path+'.'+i)).join('')+'</div>'}
function openReply(id,path){let el=document.getElementById('reply-'+path.replaceAll('.','-'));el.innerHTML='<form onsubmit="addComment(event,'+id+',\''+path+'\')"><textarea name="body" required placeholder="Odpowiedź…"></textarea><button class="primary">Odpowiedz</button></form>';el.querySelector('textarea').focus()}
function addComment(e,id,path=''){e.preventDefault();let b=e.target.body.value.trim();if(!b)return;let a=state.posts.find(p=>p.id===id).comments;if(path)for(const i of path.split('.'))a=a[+i].replies||(a[+i].replies=[]);a.push({user:'me',body:b,replies:[]});save();render()}
function persistDraft(){try{sessionStorage.setItem('przekop-draft-v1',JSON.stringify({text:{...drafts.text,image:''},link:{...drafts.link,image:''}}))}catch{}}
function switchMode(m){mode=m;renderEditor()}
function changeDraft(e){drafts[mode][e.target.name]=e.target.value;persistDraft();syncEditor()}
function syncEditor(){let d=drafts[mode],err=validate(d,false);$('#counter').textContent=d.body.length+' / 5000';$('#editorError').textContent=err;$('#publish').disabled=!!validate(d,true);let p=$('#linkPreview');if(p)p.innerHTML=linkCard({url:d.url,title:d.title});let pv=$('#preview');if(pv)pv.innerHTML=''}
function validate(d,required){if(mode==='link'){if(inlineURL(d.body)||hashtags(d.body).length||inlineURL(d.title)||hashtags(d.title).length)return 'Link i tagi dodaj w przeznaczonych do tego polach.';if(d.url&&!safeurl(d.url))return 'Podaj poprawny adres URL.';if(required&&(!safeurl(d.url)||!d.title.trim()||!parseTags(d.tags).length))return 'Uzupełnij link, tytuł i przynajmniej jeden tag.'}else if(required&&!d.body.trim()&&!d.image)return 'Dodaj treść lub zdjęcie.';return ''}
function insert(t){let e=$('#body');e.setRangeText(t,e.selectionStart,e.selectionEnd,'end');changeDraft({target:e});e.focus()}
function attach(e){let f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>1500000){toast('Wybierz JPG, PNG, GIF lub WebP do 1,5 MB.');return}let m=mode,r=new FileReader();r.onload=()=>{drafts[m].image=r.result;if(mode===m)renderEditor()};r.readAsDataURL(f)}
function removeImage(){drafts[mode].image='';renderEditor()}
function makePost(){let d=drafts[mode];return {id:Date.now(),user:'me',time:'teraz',kind:mode,title:mode==='link'?d.title.trim():'',body:d.body.trim(),url:mode==='link'?safeurl(d.url):'',tags:mode==='link'?parseTags(d.tags):hashtags(d.body),image:d.image,score:0,comments:[]}}
function preview(){let err=validate(drafts[mode],true);if(err){toast(err);return}$('#preview').innerHTML='<h3 style="margin:20px 0 12px">Podgląd</h3>'+post(makePost(),true)}
function publish(e){e.preventDefault();let err=validate(drafts[mode],true);if(err){toast(err);return}let p=makePost();if(p.tags.includes('polityka')){toast('Tag #polityka jest niedostępny.');return}state.posts.unshift(p);if(!save()){state.posts.shift();return}drafts[mode]={body:'',title:'',url:'',tags:'',image:''};persistDraft();go('post/'+p.id);toast('Wpis opublikowany')}
function renderEditor(){let d=drafts[mode],link=mode==='link';$('#main').innerHTML='<div class="page-head"><h1>Dodaj publikację</h1><a class="back" style="margin:0" href="#home">Anuluj</a></div><form class="editor" onsubmit="publish(event)"><div class="editor-tabs"><button type="button" class="'+(!link?'active':'')+'" onclick="switchMode(\'text\')">'+I('edit')+' Wpis</button><button type="button" class="'+(link?'active':'')+'" onclick="switchMode(\'link\')">'+I('link')+' Znalezisko</button></div><div class="editor-main"><div class="row between">'+user('me')+'<span class="meta">Publiczny</span></div>'+(link?'<div class="field"><label for="url">Link</label><input id="url" name="url" type="url" placeholder="https://…" value="'+esc(d.url)+'" oninput="changeDraft(event)"><div id="linkPreview">'+linkCard(d)+'</div></div><div class="field"><label for="title">Tytuł</label><input id="title" name="title" maxlength="180" placeholder="Tytuł znaleziska" value="'+esc(d.title)+'" oninput="changeDraft(event)"></div>':'')+'<div class="field"><label for="body">'+(link?'Opis <small>· opcjonalny</small>':'Treść')+'</label><textarea id="body" name="body" maxlength="5000" placeholder="'+(link?'Dodaj kontekst lub własny komentarz…':'Co chcesz opublikować?')+'" oninput="changeDraft(event)">'+esc(d.body)+'</textarea><div class="toolbar"><div><button type="button" onclick="insert(\'@\')">@</button>'+(!link?'<button type="button" onclick="insert(\'#\')">#</button>':'')+'</div><span id="counter"></span></div></div>'+(link?'<div class="field"><label for="tags">Tagi</label><input id="tags" name="tags" placeholder="#technologia #ciekawostki" value="'+esc(d.tags)+'" oninput="changeDraft(event)"><span class="hint">Przynajmniej jeden tag. Oddziel spacją lub przecinkiem.</span></div>':'')+'<div class="field"><label>Zdjęcie <small>· opcjonalne</small></label><label class="drop" for="file">'+I('image')+'<span>Wybierz zdjęcie<br><span class="hint">JPG, PNG, GIF, WebP · do 1,5 MB</span></span></label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="attach(event)">'+(d.image?'<img class="post-img" src="'+esc(d.image)+'" alt="Podgląd zdjęcia"><button type="button" class="secondary" onclick="removeImage()">Usuń zdjęcie</button>':'')+'</div><p class="error" id="editorError" role="status"></p></div><div class="editor-footer"><button type="button" class="secondary" onclick="preview()">Podgląd</button><button id="publish" class="primary">'+(link?'Dodaj znalezisko':'Opublikuj wpis')+'</button></div></form><div id="preview"></div>';syncEditor()}
function render(){let r=route(),[view,param]=r.split('/');chrome(r);if(view==='compose'){renderEditor();return}if(view==='post'){let p=state.posts.find(p=>p.id===+param);if(!p){$('#main').innerHTML='<div class="empty">Nie znaleziono wpisu.</div>';return}$('#main').innerHTML='<a class="back" href="#home">'+I('back')+' Wróć do feedu</a>'+post(p)+'<section class="comments"><h3>Komentarze ('+count(p.comments)+')</h3><form onsubmit="addComment(event,'+p.id+')"><textarea name="body" required placeholder="Dodaj komentarz…"></textarea><div class="row" style="justify-content:flex-end;margin-bottom:16px"><button class="primary">Dodaj komentarz</button></div></form>'+p.comments.map((c,i)=>commentHTML(c,p.id,String(i))).join('')+'</section>';return}
let list=[...state.posts],title={home:'Główna',hot:'Gorące',new:'Najnowsze',following:'Obserwowane',saved:'Zapisane',tag:'#'+param,profile:'Profil'}[view]||'Główna';if(view==='home')list=list.filter(p=>score(p)>=30);if(view==='hot')list.sort((a,b)=>score(b)-score(a));if(view==='new')list.sort((a,b)=>b.id-a.id);if(view==='following')list=list.filter(p=>state.followUsers.includes(p.user)||p.tags.some(t=>state.followTags.includes(t)));if(view==='saved')list=list.filter(p=>state.saved.includes(p.id));if(view==='tag')list=list.filter(p=>p.tags.includes(param));if(view==='profile')list=list.filter(p=>p.user===param);if(query)list=list.filter(p=>[p.title,p.body,p.user,...p.tags].join(' ').toLowerCase().includes(query.toLowerCase()));if(filter!=='all')list=list.filter(p=>p.kind===filter);if(sort==='score')list.sort((a,b)=>score(b)-score(a));if(sort==='new')list.sort((a,b)=>b.id-a.id);
let action=view==='tag'?'<button class="secondary" id="followBtn">'+(state.followTags.includes(param)?'Obserwujesz':'Obserwuj')+'</button>':'<select class="select" aria-label="Sortowanie" onchange="sort=this.value;render()"><option value="default" '+(sort==='default'?'selected':'')+'>Domyślnie</option><option value="new" '+(sort==='new'?'selected':'')+'>Najnowsze</option><option value="score" '+(sort==='score'?'selected':'')+'>Najlepsze</option></select>';
let head='<div class="page-head"><h1>'+esc(title)+'</h1>'+action+'</div>';
if(view==='profile'){head='<div class="profile"><div class="profile-cover"></div><div class="profile-inner">'+avatar(param||'me')+'<div class="row between"><h1>'+esc(param)+'</h1>'+(param!=='me'?'<button class="secondary" id="followBtn">'+(state.followUsers.includes(param)?'Obserwujesz':'Obserwuj')+'</button>':'')+'</div><div class="stats"><span><b>'+state.posts.filter(p=>p.user===param).length+'</b> publikacji</span><span><b>'+state.posts.filter(p=>p.user===param).reduce((n,p)=>n+score(p),0)+'</b> punktów</span></div></div></div>'}
$('#main').innerHTML=head+'<div class="feed-tabs">'+[['all','Wszystkie'],['text','Wpisy'],['link','Znaleziska']].map(([k,l])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+l+'</button>').join('')+'</div>'+(list.length?list.map(p=>post(p)).join(''):'<div class="empty">Brak publikacji.</div>');let f=$('#followBtn');if(f)f.onclick=()=>follow(view==='tag'?'tag':'user',param)}
$('#logo').innerHTML=I('logo');$('#searchWrap').insertAdjacentHTML('afterbegin',I('search'));$('#search').oninput=e=>{query=e.target.value;if(route().startsWith('compose')||route().startsWith('post/'))go('home');else render()};$('#theme').onclick=()=>{state.dark=!state.dark;save();chrome(route())};window.onhashchange=()=>{filter='all';sort='default';window.scrollTo(0,0);render()};render();
</script></body></html>
